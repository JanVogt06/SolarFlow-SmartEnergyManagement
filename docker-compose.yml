services:
    solarflow:
        build: .
        container_name: solarflow-monitor
        restart: unless-stopped

        ports:
            - "8000:8000"

        environment:
            - API_ENABLED=True
            - API_HOST=0.0.0.0
            - API_PORT=8000
            - ENABLE_HUE=True
            - HUE_BRIDGE_IP=192.168.178.26

        # Vor dem ersten Start anlegen, sonst legt Docker Verzeichnisse an:
        # touch solar_monitor.log devices.json settings.json .python_hue
        volumes:
            - ./solar_monitor.log:/app/solar_monitor.log
            - ./devices.json:/app/devices.json
            - ./settings.json:/app/settings.json
            - ./Datalogs:/app/Datalogs
            # Bridge-Token bleibt nach Restart erhalten
            - ./.python_hue:/root/.python_hue

        networks:
            - solarflow-network

networks:
    solarflow-network:
        driver: bridge
